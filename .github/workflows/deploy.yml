name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying manually from the Actions tab.
  workflow_dispatch:

# If several pushes land at once, let the newest finish rather than racing.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the built site to the gh-pages branch.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The cipher exists twice (backend/cipher.py and frontend/src/lib), and the
      # parity suite is what stops them drifting apart. A drifted cipher still
      # "works" but silently stops decoding anything encoded earlier, so this
      # gates the deploy rather than just reporting.
      - name: Run cipher parity tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Publish to gh-pages
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages \
            --dist build \
            --dotfiles \
            --user "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --message "Deploy ${GITHUB_SHA}"
