name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying manually from the Actions tab.
  workflow_dispatch:

# If several pushes land at once, let the newest finish rather than racing.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the built site to the gh-pages branch.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The cipher exists twice (backend/cipher.py and frontend/src/lib), and the
      # parity suite is what stops them drifting apart. A drifted cipher still
      # "works" but silently stops decoding anything encoded earlier, so this
      # gates the deploy rather than just reporting.
      - name: Run cipher parity tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend
        run: npm run build

      # Published with plain git rather than the gh-pages package: the branch
      # holds generated output only, so it is rebuilt from scratch each time
      # instead of accumulating history.
      - name: Publish to gh-pages
        working-directory: frontend/build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
